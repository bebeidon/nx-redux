minarch_screen_scaling = Aspect
minarch_overlay = Aspect.png

# The WonderSwan runs at 75 Hz; 60 Hz mode drops 1 of every 5 frames so it
# paces cleanly on a 60 Hz screen.
wswan_60hz_mode = enabled
# After Select rotates a vertical game, move the D-Pad to the active cursor.
wswan_rotate_keymap = auto
